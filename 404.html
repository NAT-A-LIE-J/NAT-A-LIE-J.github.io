		<script>
			// Clean-URL routing for a handful of pages that don't live at their
			// short name — anything not matched here just falls through to the
			// 404 content below.
			var routes = {
				'ThankYouB': '/archive/ThankYouB/ThankYouB.html',
				'ThankYouB.html': '/archive/ThankYouB/ThankYouB.html',
				'ThankYouKS': '/archive/ThankYouKS/ThankYouKS.html',

				'caseComps.html': '/caseComps.html',
				'sweetheartBubble': '/sweetheartBubble.html',
				'sweetheartBubble.html': '/sweetheartBubble.html',
				'AdvantesPoster': '/AdvantesPoster.html',
				'AdvantesPoster.html': '/AdvantesPoster.html',
				'interviewMe': '/interviewMe.html',
				'interviewMe.html': '/interviewMe.html'
			};

			function handleRouting() {
				var path = window.location.pathname.replace(/^\/+|\/+$/g, '');
				if (routes[path]) {
					window.location.replace(routes[path]);
				}
			}

			window.addEventListener('load', handleRouting);
		</script>
